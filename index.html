<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 15 6 8 10 1 6z' fill='%237a9552'/%3E%3Cpath d='M1 6 8 10v4L1 10z' fill='%236a4c31'/%3E%3Cpath d='M15 6 8 10v4l7-4z' fill='%235a4029'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Silkscreen&family=Source+Sans+3:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        --px: 1px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: 'Silkscreen', monospace;
        font-size: calc(var(--px) * 8);
        line-height: 1.25;
        color: #eef2ff;
        text-shadow: var(--px) var(--px) 0 #0a0f24;
      }
      #tile-info {
        position: absolute;
        left: calc(var(--px) * 8);
        bottom: calc(var(--px) * 8);
        min-width: calc(var(--px) * 92);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #tile-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #tile-info .h,
      #tile-info .stats {
        color: #ffe27a;
      }
      #tile-info .cover {
        color: #b4e08c;
      }
      #hud {
        position: absolute;
        left: calc(var(--px) * 8);
        top: calc(var(--px) * 8);
        max-width: calc(var(--px) * 200);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #hud .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--px) * 4);
        margin-top: calc(var(--px) * 3);
      }
      #hud button,
      #hud select {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        color: #ffe27a;
        text-shadow: inherit;
        padding: 0 calc(var(--px) * 3);
        background: #22306a;
        border: var(--px) solid #8fa0d8;
        border-radius: calc(var(--px) * 1);
      }
      #hud select option {
        background: #22306a;
      }
      #hud button:hover,
      #hud button:focus-visible,
      #hud select:hover,
      #hud select:focus-visible {
        background: #3a4f9a;
        outline: none;
      }
      #hud .notice {
        margin-top: calc(var(--px) * 3);
        color: #ffb8a8;
      }
      #unit-info,
      #turn-info {
        position: absolute;
        right: calc(var(--px) * 8);
        min-width: calc(var(--px) * 108);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #unit-info { bottom: calc(var(--px) * 8); }
      #turn-info { top: calc(var(--px) * 8); min-width: calc(var(--px) * 84); }
      #unit-info.enemy,
      #turn-info.enemy {
        background: linear-gradient(#8a3434, #4d1818);
      }
      #unit-info .head,
      #turn-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #unit-info .side,
      #unit-info .stats,
      #turn-info .mov {
        color: #ffe27a;
      }
      #unit-info .cls,
      #turn-info .keys {
        color: #b4e08c;
      }
      #unit-info .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--px) * 4);
      }
      #unit-info .bar {
        flex: 1;
        height: calc(var(--px) * 4);
        background: #0a0f24;
        border: var(--px) solid #8fa0d8;
      }
      #unit-info .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(#9cf08a, #4aa83a);
      }
      #unit-info .skl .bar span {
        background: linear-gradient(#fff0b0, #e0a530);
      }
      #unit-info .skl.full .bar span {
        background: linear-gradient(#fffbe0, #ffd34a);
        box-shadow: 0 0 var(--px) #ffe27a;
      }
      /* The hand: menu-style cards along the bottom; the tile and unit panels step aside while it is open. */
      #ui.choosing #tile-info,
      #ui.choosing #unit-info {
        display: none;
      }
      /* The hand: the animated cards on their own canvas, at full resolution and smooth like the
         battle scenes (src/cards/HandView.ts). Invisible boxes over the cards take the pointer. */
      #card-hand {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        font-family: 'Source Sans 3', system-ui, sans-serif;
      }
      #card-hand[hidden] {
        display: none;
      }
      #card-hand canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }
      #card-hand .card {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        cursor: pointer;
        touch-action: none;
        border-radius: 3%;
      }
      #card-hand .card.used,
      #card-hand .card.played,
      #card-hand .card.locked {
        cursor: default;
      }
      #card-hand .card .stamp {
        position: absolute;
        left: -4%;
        right: -4%;
        top: 46%;
        padding: 0.25em 0;
        font-family: Cinzel, serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: center;
        color: #ffe08a;
        background: rgba(10, 12, 26, 0.84);
        border-top: 1px solid rgba(255, 224, 138, 0.6);
        border-bottom: 1px solid rgba(255, 224, 138, 0.6);
        transform: rotate(-8deg);
        white-space: nowrap;
      }
      #card-hand .keys {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.3em 1em;
        font-size: clamp(12px, 1.5vh, 16px);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #f4f1e8;
        background: rgba(12, 16, 32, 0.72);
        border: 1px solid rgba(255, 244, 214, 0.35);
        border-radius: 1em;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* The battle scene: full resolution and smooth, never pixelated. */
      #battle {
        position: fixed;
        inset: 0;
        image-rendering: auto;
      }
      #battle-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        color: #f4f1e8;
        --u: min(1vw, 1.78vh);
      }
      #battle-hud .banner {
        position: absolute;
        top: calc(var(--u) * 1.6);
        width: calc(var(--u) * 34);
        padding: calc(var(--u) * 0.9) calc(var(--u) * 1.4);
        border-radius: calc(var(--u) * 0.6);
        border: calc(var(--u) * 0.18) solid rgba(255, 244, 214, 0.85);
        box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35);
        text-shadow: 0 calc(var(--u) * 0.12) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.6);
      }
      #battle-hud .banner.left {
        left: calc(var(--u) * 1.6);
        background: linear-gradient(160deg, rgba(40, 72, 160, 0.92), rgba(18, 30, 78, 0.92));
      }
      #battle-hud .banner.right {
        right: calc(var(--u) * 1.6);
        text-align: right;
        background: linear-gradient(200deg, rgba(168, 44, 44, 0.92), rgba(78, 16, 20, 0.92));
      }
      /* The colour follows the side, not the place: the player's is blue and the foes' red, whichever
         end of the field each stands at (the foes attack from the left, B7). */
      #battle-hud .banner.ally {
        background: linear-gradient(160deg, rgba(40, 72, 160, 0.92), rgba(18, 30, 78, 0.92));
      }
      #battle-hud .banner.foe {
        background: linear-gradient(200deg, rgba(168, 44, 44, 0.92), rgba(78, 16, 20, 0.92));
      }
      #battle-hud .who {
        display: flex;
        align-items: baseline;
        gap: calc(var(--u) * 1);
      }
      #battle-hud .right .who { flex-direction: row-reverse; }
      #battle-hud .name {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 2.3);
        letter-spacing: 0.04em;
      }
      #battle-hud .cls {
        font-size: calc(var(--u) * 1.3);
        color: #ffe7a8;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      #battle-hud .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 0.8);
        margin-top: calc(var(--u) * 0.5);
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
      }
      #battle-hud .right .morale { flex-direction: row-reverse; }
      #battle-hud .label { letter-spacing: 0.12em; color: #ffe7a8; }
      #battle-hud .bar {
        flex: 1;
        height: calc(var(--u) * 1.1);
        border-radius: calc(var(--u) * 0.6);
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
      }
      #battle-hud .right .bar { justify-content: flex-end; }
      #battle-hud .bar span {
        background: linear-gradient(#b8f59a, #4fae3c);
        border-radius: inherit;
      }
      #battle-hud .value { font-size: calc(var(--u) * 1.6); min-width: calc(var(--u) * 3.4); }
      #battle-hud .troops {
        display: flex;
        gap: calc(var(--u) * 0.45);
        margin-top: calc(var(--u) * 0.6);
      }
      #battle-hud .right .troops { justify-content: flex-end; }
      #battle-hud .troops i {
        width: calc(var(--u) * 1.1);
        height: calc(var(--u) * 1.1);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.6);
      }
      #battle-hud .troops i.up { background: #ffe08a; }
      #battle-hud .morale .label { min-width: calc(var(--u) * 6.4); }
      #battle-hud .who .edge {
        margin-left: auto;
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
        letter-spacing: 0.12em;
      }
      #battle-hud .right .who .edge { margin-left: 0; margin-right: auto; }
      #battle-hud .stance {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 0.5);
        margin-top: calc(var(--u) * 0.7);
        font-weight: 700;
        font-size: calc(var(--u) * 1.1);
      }
      #battle-hud .right .stance { flex-direction: row-reverse; }
      #battle-hud .stance .label { font-size: calc(var(--u) * 1.3); min-width: calc(var(--u) * 6.4); }
      #battle-hud .stance b {
        padding: calc(var(--u) * 0.2) calc(var(--u) * 0.7);
        border-radius: calc(var(--u) * 0.4);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.25);
        background: rgba(0, 0, 0, 0.35);
        color: rgba(244, 241, 232, 0.55);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #battle-hud .stance b.on {
        background: #ffe08a;
        border-color: #fff4d6;
        color: #2a1d08;
        text-shadow: none;
      }
      #battle-hud .stance kbd {
        font: inherit;
        margin-right: calc(var(--u) * 0.4);
        padding: 0 calc(var(--u) * 0.3);
        border-radius: calc(var(--u) * 0.25);
        border: calc(var(--u) * 0.1) solid currentColor;
      }
      #battle-hud .skill .bar span { background: linear-gradient(#fff0b0, #e0a530); }
      #battle-hud .vs {
        position: absolute;
        top: calc(var(--u) * 3.2);
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 3.2);
        color: #fff4d6;
        text-shadow: 0 0 calc(var(--u) * 0.8) rgba(0, 0, 0, 0.7);
      }
      #battle-hud .effect {
        position: absolute;
        bottom: calc(var(--u) * 1.8);
        left: 50%;
        transform: translateX(-50%);
        padding: calc(var(--u) * 0.5) calc(var(--u) * 1.8);
        border-radius: calc(var(--u) * 2);
        background: rgba(12, 16, 32, 0.72);
        border: calc(var(--u) * 0.15) solid rgba(255, 244, 214, 0.7);
        font-weight: 700;
        font-size: calc(var(--u) * 1.4);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #battle-hud .callout,
      #battle-hud .loss {
        position: absolute;
        font-family: 'Cinzel', serif;
        font-weight: 700;
        color: #fff4d6;
        letter-spacing: 0.08em;
        text-shadow: 0 0 calc(var(--u) * 0.6) rgba(0, 0, 0, 0.8), 0 calc(var(--u) * 0.2) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.6);
      }
      #battle-hud .callout {
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        font-size: calc(var(--u) * 5);
      }
      #battle-hud .loss {
        top: 36%;
        font-size: calc(var(--u) * 6);
        color: #ffd2c4;
      }
      #battle-hud .loss.left { left: 22%; }
      #battle-hud .loss.right { right: 22%; }
      /* Which battle of a Union attack this is, under the VS. */
      #battle-hud .union {
        position: absolute;
        top: calc(var(--u) * 7.4);
        left: 50%;
        transform: translateX(-50%);
        padding: calc(var(--u) * 0.3) calc(var(--u) * 1.2);
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 1.5);
        letter-spacing: 0.14em;
        color: #2a1d08;
        background: linear-gradient(#ffe8a0, #e8b84c);
        border: calc(var(--u) * 0.12) solid #fff4d6;
        border-radius: calc(var(--u) * 1);
        box-shadow: 0 calc(var(--u) * 0.2) calc(var(--u) * 0.8) rgba(0, 0, 0, 0.45);
      }
      /* The card skill guide (B6): what the card in play can do in this battle, and the choice. */
      #battle-hud .guide {
        position: absolute;
        left: calc(var(--u) * 1.6);
        bottom: calc(var(--u) * 1.6);
        width: calc(var(--u) * 27);
        padding: calc(var(--u) * 0.8) calc(var(--u) * 1.2);
        border-radius: calc(var(--u) * 0.6);
        border: calc(var(--u) * 0.15) solid rgba(255, 224, 138, 0.7);
        background: rgba(10, 12, 26, 0.82);
        box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.45);
        font-size: calc(var(--u) * 1.25);
        line-height: 1.35;
      }
      #battle-hud .guide.ready {
        border-color: #ffe08a;
        box-shadow: 0 0 calc(var(--u) * 1.6) rgba(255, 210, 110, 0.55);
      }
      #battle-hud .guide .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--u) * 1);
        align-items: baseline;
      }
      #battle-hud .guide .card {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        color: #ffe08a;
        letter-spacing: 0.05em;
      }
      #battle-hud .guide .skill {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 600;
        font-size: calc(var(--u) * 1.5);
      }
      #battle-hud .guide .text {
        margin-top: calc(var(--u) * 0.2);
        color: #f4f1e8;
        opacity: 0.9;
      }
      #battle-hud .guide .status {
        margin-top: calc(var(--u) * 0.6);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: calc(var(--u) * 0.6);
        color: #c9d1e8;
      }
      #battle-hud .guide b {
        color: #ffe7a8;
      }
      #battle-hud .guide b.ready {
        color: #2a1d08;
        background: #ffe08a;
        padding: 0 calc(var(--u) * 0.6);
        border-radius: calc(var(--u) * 0.4);
        letter-spacing: 0.12em;
      }
      #battle-hud .guide button {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        color: #f4f1e8;
        background: rgba(40, 52, 100, 0.9);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.5);
        border-radius: calc(var(--u) * 0.5);
        padding: calc(var(--u) * 0.25) calc(var(--u) * 0.8);
      }
      #battle-hud .guide button[data-act='fire'] {
        background: linear-gradient(#ffe8a0, #e0a530);
        color: #2a1d08;
      }
      #battle-hud .guide kbd {
        font: inherit;
        font-size: 0.85em;
        margin-right: calc(var(--u) * 0.3);
        padding: 0 calc(var(--u) * 0.3);
        border-radius: calc(var(--u) * 0.25);
        border: calc(var(--u) * 0.1) solid currentColor;
      }
      #battle-hud .skill.full .bar span {
        background: linear-gradient(#fffbe0, #ffd34a);
        box-shadow: 0 0 calc(var(--u) * 0.8) rgba(255, 220, 110, 0.9);
      }
      /* A card skill's cut-in (src/battle/CutIn.ts): the card's clip in a band sweeping across. */
      #cut-in {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        overflow: hidden;
      }
      /* The battle dims behind the band, so the card's clip is the focus. */
      #cut-in .dim {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(5, 6, 14, 0.55), rgba(5, 6, 14, 0.82));
        animation: cut-in-dim var(--cut-in) both;
      }
      #cut-in .band {
        position: absolute;
        left: -10%;
        right: -10%;
        top: 22%;
        height: 56%;
        display: flex;
        align-items: center;
        background: linear-gradient(90deg, rgba(10, 12, 26, 0), rgba(10, 12, 26, 0.95) 12%, rgba(10, 12, 26, 0.95) 88%, rgba(10, 12, 26, 0));
        border-top: 3px solid #ffe08a;
        border-bottom: 3px solid #ffe08a;
        box-shadow: 0 0 80px rgba(255, 200, 90, 0.45);
        animation: cut-in-band var(--cut-in) cubic-bezier(0.25, 0.8, 0.25, 1) both;
      }
      #cut-in .art {
        position: relative;
        height: 112%;
        aspect-ratio: 1;
        margin-left: 17%;
        background-size: cover;
        background-position: center;
        border: 4px solid #ffe08a;
        transform: skewY(6deg);
        overflow: hidden;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 210, 120, 0.35);
      }
      #cut-in .art video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #cut-in .art video.on {
        opacity: 1;
      }
      #cut-in .words {
        margin-left: 4%;
        transform: skewY(6deg);
        animation: cut-in-words var(--cut-in) both;
      }
      #cut-in .skill {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: min(6vw, 10.5vh);
        line-height: 1;
        letter-spacing: 0.05em;
        color: #ffe08a;
        text-shadow: 0 0.04em 0 #7a4a10, 0 0 0.3em rgba(255, 190, 80, 0.6);
      }
      #cut-in .card {
        margin-top: 0.3em;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 600;
        font-size: min(2.6vw, 4.4vh);
        color: #f4f1e8;
      }
      #cut-in .flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        animation: cut-in-flash var(--cut-in) both;
      }
      /* In about half a second, then a slow drift while the clip plays, then out in the flash. */
      @keyframes cut-in-band {
        0% { transform: translateX(110%) skewY(-6deg); }
        12% { transform: translateX(0) skewY(-6deg); }
        88% { transform: translateX(-3%) skewY(-6deg); }
        100% { transform: translateX(-125%) skewY(-6deg); }
      }
      @keyframes cut-in-words {
        0%, 10% { opacity: 0; transform: skewY(6deg) translateX(4%); }
        20% { opacity: 1; transform: skewY(6deg) translateX(0); }
        100% { opacity: 1; transform: skewY(6deg) translateX(0); }
      }
      @keyframes cut-in-dim {
        0% { opacity: 0; }
        10%, 90% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes cut-in-flash {
        0%, 88% { opacity: 0; }
        93% { opacity: 0.85; }
        100% { opacity: 0; }
      }
      /* The end of a skirmish (src/ui/ResultScreen.ts): over the board, full resolution. */
      #result {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 45%, rgba(8, 10, 22, 0.55), rgba(4, 5, 12, 0.88));
        font-family: 'Source Sans 3', system-ui, sans-serif;
        color: #f4f1e8;
        --u: min(1vw, 1.78vh);
        animation: result-in 0.6s ease-out both;
      }
      #result .panel {
        min-width: min(92vw, calc(var(--u) * 46));
        padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
        text-align: center;
        border-radius: calc(var(--u) * 1);
        border: calc(var(--u) * 0.2) solid #ffe08a;
        background: linear-gradient(170deg, rgba(30, 42, 90, 0.95), rgba(12, 16, 36, 0.96));
        box-shadow: 0 0 calc(var(--u) * 4) rgba(255, 210, 120, 0.35);
      }
      #result.defeat .panel {
        border-color: #e58a7a;
        background: linear-gradient(170deg, rgba(90, 28, 32, 0.95), rgba(30, 10, 14, 0.96));
        box-shadow: 0 0 calc(var(--u) * 4) rgba(230, 90, 80, 0.35);
      }
      #result .title {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: max(40px, calc(var(--u) * 7));
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffe08a;
        text-shadow: 0 0.05em 0 #6a4210, 0 0 0.35em rgba(255, 200, 90, 0.6);
      }
      #result.defeat .title {
        color: #ffb3a6;
        text-shadow: 0 0.05em 0 #4a1010, 0 0 0.35em rgba(255, 110, 90, 0.5);
      }
      #result .line {
        margin-top: calc(var(--u) * 0.4);
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: max(18px, calc(var(--u) * 2));
      }
      #result .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: calc(var(--u) * 0.8) calc(var(--u) * 2.4);
        margin: calc(var(--u) * 2) 0;
      }
      #result .stats dt {
        font-size: max(12px, calc(var(--u) * 1.2));
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #c9d1e8;
      }
      #result .stats dd {
        margin: 0;
        font-weight: 700;
        font-size: max(22px, calc(var(--u) * 2.6));
      }
      #result .buttons {
        display: flex;
        gap: calc(var(--u) * 1.2);
        justify-content: center;
        flex-wrap: wrap;
      }
      #result button {
        min-height: 44px;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        font-size: max(16px, calc(var(--u) * 1.5));
        padding: calc(var(--u) * 0.6) calc(var(--u) * 1.6);
        border-radius: calc(var(--u) * 0.6);
        color: #f4f1e8;
        background: rgba(40, 52, 100, 0.9);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.55);
      }
      #result button[data-act='again'] {
        color: #2a1d08;
        background: linear-gradient(#ffe8a0, #e0a530);
      }
      #result kbd {
        font: inherit;
        font-size: 0.8em;
        margin-right: 0.4em;
        padding: 0 0.3em;
        border-radius: 0.25em;
        border: 1px solid currentColor;
      }
      @keyframes result-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      #battle-hud [hidden] { display: none; }
      #fallback {
        color: #c8c2b0;
        font: 16px monospace;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="ui"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
