<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 15 6 8 10 1 6z' fill='%237a9552'/%3E%3Cpath d='M1 6 8 10v4L1 10z' fill='%236a4c31'/%3E%3Cpath d='M15 6 8 10v4l7-4z' fill='%235a4029'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Silkscreen&family=Source+Sans+3:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        --px: 1px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: 'Silkscreen', monospace;
        font-size: calc(var(--px) * 8);
        line-height: 1.25;
        color: #eef2ff;
        text-shadow: var(--px) var(--px) 0 #0a0f24;
      }
      #tile-info {
        position: absolute;
        left: calc(var(--px) * 8);
        bottom: calc(var(--px) * 8);
        min-width: calc(var(--px) * 92);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #tile-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #tile-info .h,
      #tile-info .stats {
        color: #ffe27a;
      }
      #tile-info .cover {
        color: #b4e08c;
      }
      #hud {
        position: absolute;
        left: calc(var(--px) * 8);
        top: calc(var(--px) * 8);
        max-width: calc(var(--px) * 200);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #hud .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--px) * 4);
        margin-top: calc(var(--px) * 3);
      }
      #hud button,
      #hud select {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        color: #ffe27a;
        text-shadow: inherit;
        padding: 0 calc(var(--px) * 3);
        background: #22306a;
        border: var(--px) solid #8fa0d8;
        border-radius: calc(var(--px) * 1);
      }
      #hud select option {
        background: #22306a;
      }
      #hud button:hover,
      #hud button:focus-visible,
      #hud select:hover,
      #hud select:focus-visible {
        background: #3a4f9a;
        outline: none;
      }
      #hud .notice {
        margin-top: calc(var(--px) * 3);
        color: #ffb8a8;
      }
      #unit-info,
      #turn-info {
        position: absolute;
        right: calc(var(--px) * 8);
        min-width: calc(var(--px) * 108);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #unit-info { bottom: calc(var(--px) * 8); }
      #turn-info { top: calc(var(--px) * 8); min-width: calc(var(--px) * 84); }
      #unit-info.enemy,
      #turn-info.enemy {
        background: linear-gradient(#8a3434, #4d1818);
      }
      #unit-info .head,
      #turn-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #unit-info .side,
      #unit-info .stats,
      #turn-info .mov {
        color: #ffe27a;
      }
      #unit-info .cls,
      #turn-info .keys {
        color: #b4e08c;
      }
      #unit-info .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--px) * 4);
      }
      #unit-info .bar {
        flex: 1;
        height: calc(var(--px) * 4);
        background: #0a0f24;
        border: var(--px) solid #8fa0d8;
      }
      #unit-info .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(#9cf08a, #4aa83a);
      }
      /* The battle scene: full resolution and smooth, never pixelated. */
      #battle {
        position: fixed;
        inset: 0;
        image-rendering: auto;
      }
      #battle-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        color: #f4f1e8;
        --u: min(1vw, 1.78vh);
      }
      #battle-hud .banner {
        position: absolute;
        top: calc(var(--u) * 1.6);
        width: calc(var(--u) * 34);
        padding: calc(var(--u) * 0.9) calc(var(--u) * 1.4);
        border-radius: calc(var(--u) * 0.6);
        border: calc(var(--u) * 0.18) solid rgba(255, 244, 214, 0.85);
        box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35);
        text-shadow: 0 calc(var(--u) * 0.12) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.6);
      }
      #battle-hud .banner.left {
        left: calc(var(--u) * 1.6);
        background: linear-gradient(160deg, rgba(40, 72, 160, 0.92), rgba(18, 30, 78, 0.92));
      }
      #battle-hud .banner.right {
        right: calc(var(--u) * 1.6);
        text-align: right;
        background: linear-gradient(200deg, rgba(168, 44, 44, 0.92), rgba(78, 16, 20, 0.92));
      }
      #battle-hud .who {
        display: flex;
        align-items: baseline;
        gap: calc(var(--u) * 1);
      }
      #battle-hud .right .who { flex-direction: row-reverse; }
      #battle-hud .name {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 2.3);
        letter-spacing: 0.04em;
      }
      #battle-hud .cls {
        font-size: calc(var(--u) * 1.3);
        color: #ffe7a8;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      #battle-hud .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 0.8);
        margin-top: calc(var(--u) * 0.5);
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
      }
      #battle-hud .right .morale { flex-direction: row-reverse; }
      #battle-hud .label { letter-spacing: 0.12em; color: #ffe7a8; }
      #battle-hud .bar {
        flex: 1;
        height: calc(var(--u) * 1.1);
        border-radius: calc(var(--u) * 0.6);
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
      }
      #battle-hud .right .bar { justify-content: flex-end; }
      #battle-hud .bar span {
        background: linear-gradient(#b8f59a, #4fae3c);
        border-radius: inherit;
      }
      #battle-hud .value { font-size: calc(var(--u) * 1.6); min-width: calc(var(--u) * 3.4); }
      #battle-hud .troops {
        display: flex;
        gap: calc(var(--u) * 0.45);
        margin-top: calc(var(--u) * 0.6);
      }
      #battle-hud .right .troops { justify-content: flex-end; }
      #battle-hud .troops i {
        width: calc(var(--u) * 1.1);
        height: calc(var(--u) * 1.1);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.6);
      }
      #battle-hud .troops i.up { background: #ffe08a; }
      #battle-hud .vs {
        position: absolute;
        top: calc(var(--u) * 3.2);
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 3.2);
        color: #fff4d6;
        text-shadow: 0 0 calc(var(--u) * 0.8) rgba(0, 0, 0, 0.7);
      }
      #battle-hud .effect {
        position: absolute;
        bottom: calc(var(--u) * 1.8);
        left: 50%;
        transform: translateX(-50%);
        padding: calc(var(--u) * 0.5) calc(var(--u) * 1.8);
        border-radius: calc(var(--u) * 2);
        background: rgba(12, 16, 32, 0.72);
        border: calc(var(--u) * 0.15) solid rgba(255, 244, 214, 0.7);
        font-weight: 700;
        font-size: calc(var(--u) * 1.4);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #fallback {
        color: #c8c2b0;
        font: 16px monospace;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="ui"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
