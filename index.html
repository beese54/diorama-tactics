<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 15 6 8 10 1 6z' fill='%237a9552'/%3E%3Cpath d='M1 6 8 10v4L1 10z' fill='%236a4c31'/%3E%3Cpath d='M15 6 8 10v4l7-4z' fill='%235a4029'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Silkscreen&family=Source+Sans+3:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        --px: 1px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: 'Silkscreen', monospace;
        font-size: calc(var(--px) * 8);
        line-height: 1.25;
        color: #eef2ff;
        text-shadow: var(--px) var(--px) 0 #0a0f24;
      }
      /* All In (B8): a pillar of gold light shoots up through each unit it fills, "SKILL FULL" rising over it. */
      #all-in .burst {
        position: absolute;
        width: 0;
        height: 0;
      }
      #all-in .pillar {
        position: absolute;
        left: calc(var(--px) * -6);
        bottom: 0;
        width: calc(var(--px) * 12);
        height: calc(var(--tall) + var(--px) * 40);
        background: linear-gradient(to top, rgba(255, 226, 122, 0.95), rgba(255, 244, 196, 0.7) 60%, rgba(255, 244, 196, 0));
        box-shadow: 0 0 calc(var(--px) * 6) rgba(255, 210, 90, 0.9);
        transform-origin: bottom;
        animation: all-in-pillar var(--all-in) ease-out var(--delay) both;
      }
      #all-in .ring {
        position: absolute;
        left: calc(var(--px) * -20);
        top: calc(var(--px) * -6);
        width: calc(var(--px) * 40);
        height: calc(var(--px) * 12);
        border: var(--px) solid #ffe27a;
        border-radius: 50%;
        box-shadow: 0 0 calc(var(--px) * 4) #ffd25a, inset 0 0 calc(var(--px) * 4) #ffd25a;
        animation: all-in-ring var(--all-in) ease-out var(--delay) both;
      }
      #all-in b {
        position: absolute;
        left: 0;
        bottom: calc(var(--tall) + var(--px) * 6);
        white-space: nowrap;
        color: #ffe27a;
        font-weight: normal;
        animation: all-in-words var(--all-in) ease-out both;
      }
      /* One word for the side, over the highest unit: crowded units' words piled up unread. */
      #all-in .burst:not(.lead) b { display: none; }
      #all-in .enemy b { color: #ffb0a0; }
      @keyframes all-in-pillar {
        0% { transform: scaleY(0); opacity: 1; }
        18% { transform: scaleY(1); opacity: 1; }
        60% { transform: scaleY(1) scaleX(0.6); opacity: 0.8; }
        100% { transform: scaleY(1.1) scaleX(0.1); opacity: 0; }
      }
      @keyframes all-in-ring {
        0% { transform: scale(0.2); opacity: 1; }
        50% { opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes all-in-words {
        0%, 10% { transform: translate(-50%, calc(var(--px) * 8)); opacity: 0; }
        25% { transform: translate(-50%, 0); opacity: 1; }
        80% { transform: translate(-50%, calc(var(--px) * -6)); opacity: 1; }
        100% { transform: translate(-50%, calc(var(--px) * -10)); opacity: 0; }
      }
      /* A move's cost (B8): by the path's last tile, what it spends of the card's MOV and what is left. */
      #path-cost {
        position: absolute;
        /* Beside the tile, to its right: below it, it covered the path it was about. */
        transform: translate(calc(var(--px) * 12), -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--px) calc(var(--px) * 3);
        background: rgba(10, 15, 36, 0.82);
        border: var(--px) solid #fff4c4;
        border-radius: calc(var(--px) * 2);
        white-space: nowrap;
      }
      #path-cost[hidden] { display: none; }
      /* After a walk (B8): CONFIRM keeps the move, UNDO walks it back; beside the mover's head. */
      #move-confirm {
        position: absolute;
        transform: translate(calc(var(--px) * 12), -50%);
        display: flex;
        flex-direction: column;
        gap: calc(var(--px) * 2);
        padding: calc(var(--px) * 2);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
        pointer-events: auto;
        white-space: nowrap;
      }
      #move-confirm[hidden] { display: none; }
      #move-confirm button {
        cursor: pointer;
        font: inherit;
        color: #eef2ff;
        text-shadow: inherit;
        text-align: left;
        padding: 0 calc(var(--px) * 4) 0 calc(var(--px) * 2);
        background: #22306a;
        border: var(--px) solid #8fa0d8;
        border-radius: var(--px);
      }
      #move-confirm button b {
        font-weight: normal;
        color: #ffd660;
        margin-right: calc(var(--px) * 3);
      }
      #move-confirm .undo b { color: #ffb0a0; }
      #move-confirm button:hover { background: #3a4f9a; border-color: #fff4c4; }
      #path-cost b { font-weight: normal; color: #ffd660; }
      #path-cost span { color: #cfe6ff; }
      /* SKILL READY (B8): a gold sparkle by the head of each unit whose gauge is full; dim when the card in play can't fire it. */
      #skill-marks .mark {
        position: absolute;
        width: 0;
        height: 0;
      }
      #skill-marks svg {
        position: absolute;
        left: calc(var(--px) * 4);
        top: calc(var(--px) * -7);
        width: calc(var(--px) * 7);
        height: calc(var(--px) * 7);
        fill: #ffd34a;
        filter: drop-shadow(var(--px) 0 0 #3a2600) drop-shadow(calc(var(--px) * -1) 0 0 #3a2600) drop-shadow(0 var(--px) 0 #3a2600) drop-shadow(0 calc(var(--px) * -1) 0 #3a2600);
      }
      #skill-marks svg .core { fill: #fffbe0; }
      #skill-marks .ready svg { animation: skill-twinkle 1.2s steps(1) infinite; }
      #skill-marks .held svg { fill: #9a927e; opacity: 0.75; }
      #skill-marks .held svg .core { fill: #c4bca8; }
      @keyframes skill-twinkle {
        0% { transform: translateY(0); fill: #ffd34a; }
        50% { transform: translateY(calc(var(--px) * -1)); fill: #fff0a0; }
      }
      #tile-info {
        position: absolute;
        left: calc(var(--px) * 8);
        bottom: calc(var(--px) * 8);
        min-width: calc(var(--px) * 92);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #tile-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #tile-info .h,
      #tile-info .stats {
        color: #ffe27a;
      }
      #tile-info .cover {
        color: #b4e08c;
      }
      #hud {
        position: absolute;
        left: calc(var(--px) * 8);
        top: calc(var(--px) * 8);
        max-width: calc(var(--px) * 200);
        padding: calc(var(--px) * 3) calc(var(--px) * 5);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
        pointer-events: auto;
      }
      /* The panels let the board show through while they rest, and turn solid under the pointer:
         the menu bar, rarely needed, the more see-through; the turn and unit boxes, read in play, the less. */
      #hud,
      #turn-info,
      #unit-info,
      #tile-info {
        transition: opacity 150ms ease-out;
      }
      #hud { opacity: 0.55; }
      #turn-info,
      #unit-info,
      #tile-info {
        opacity: 0.85;
      }
      /* The menu bar and the turn box take the pointer; the tile and unit boxes don't, as they
         follow the tile under it and mustn't cover it. */
      #turn-info {
        pointer-events: auto;
      }
      #hud:hover,
      #hud.open,
      #turn-info:hover {
        opacity: 1;
      }
      #hud .bar {
        display: flex;
        align-items: center;
        gap: calc(var(--px) * 6);
      }
      #hud .bar .title {
        margin-right: auto;
      }
      #hud .menu-toggle.on {
        background: #3a4f9a;
      }
      #notice {
        position: absolute;
        top: calc(var(--px) * 8);
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(var(--px) * 160);
        padding: calc(var(--px) * 2) calc(var(--px) * 5);
        color: #ffe27a;
        text-align: center;
        background: rgba(16, 22, 52, 0.85);
        border: var(--px) solid #8fa0d8;
        border-radius: calc(var(--px) * 2);
        animation: notice-fade 5s ease-in forwards;
      }
      @keyframes notice-fade {
        0%, 80% { opacity: 1; }
        100% { opacity: 0; }
      }
      #hud .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--px) * 4);
        margin-top: calc(var(--px) * 3);
      }
      #hud button,
      #hud select {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        color: #ffe27a;
        text-shadow: inherit;
        padding: 0 calc(var(--px) * 3);
        background: #22306a;
        border: var(--px) solid #8fa0d8;
        border-radius: calc(var(--px) * 1);
      }
      /* The sound controls (B8): the volume sliders, in the menu's own colours. */
      #hud .volume {
        display: inline-flex;
        align-items: center;
        gap: calc(var(--px) * 2);
        color: #ffe27a;
        pointer-events: auto;
      }
      #hud .volume input {
        width: calc(var(--px) * 40);
        height: calc(var(--px) * 6);
        accent-color: #ffe27a;
        cursor: pointer;
      }
      #hud select option {
        background: #22306a;
      }
      #hud button:hover,
      #hud button:focus-visible,
      #hud select:hover,
      #hud select:focus-visible {
        background: #3a4f9a;
        outline: none;
      }
      #unit-info,
      #turn-info {
        position: absolute;
        right: calc(var(--px) * 8);
        min-width: calc(var(--px) * 108);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #unit-info { bottom: calc(var(--px) * 8); }
      #turn-info { top: calc(var(--px) * 8); min-width: calc(var(--px) * 84); }
      #unit-info.enemy,
      #turn-info.enemy {
        background: linear-gradient(#8a3434, #4d1818);
      }
      #unit-info .head,
      #turn-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #unit-info .side,
      #unit-info .stats,
      #turn-info .mov {
        color: #ffe27a;
      }
      #unit-info .cls,
      #turn-info .keys {
        color: #b4e08c;
      }
      #unit-info .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--px) * 4);
      }
      #unit-info .bar {
        flex: 1;
        height: calc(var(--px) * 4);
        background: #0a0f24;
        border: var(--px) solid #8fa0d8;
      }
      #unit-info .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(#9cf08a, #4aa83a);
      }
      #unit-info .skl .bar span {
        background: linear-gradient(#fff0b0, #e0a530);
      }
      #unit-info .skl.full .bar span {
        background: linear-gradient(#fffbe0, #ffd34a);
        box-shadow: 0 0 var(--px) #ffe27a;
      }
      #unit-info .skl.ready > span:last-child { color: #ffe27a; }
      #unit-info .skl.held > span:last-child { color: #c4bca8; }
      #unit-info .skl.held .bar span { background: linear-gradient(#d8d0bc, #9a927e); box-shadow: none; }
      /* Pointed at, the unit box floats beside the unit, its portrait at the left. */
      #unit-info {
        display: flex;
        gap: calc(var(--px) * 4);
        align-items: flex-start;
      }
      #unit-info[hidden] { display: none; }
      /* The unit's weapon symbol before its class (B8), in the type's colour as on the battle banners. */
      #unit-info .wicon {
        display: inline-grid;
        place-items: center;
        width: calc(var(--px) * 10);
        height: calc(var(--px) * 10);
        margin-right: calc(var(--px) * 2);
        vertical-align: middle;
        border-radius: 50%;
        border: var(--px) solid #f2dc9a;
      }
      #unit-info .wicon svg { width: 82%; height: 82%; }
      #unit-info .info { flex: 1; min-width: 0; }
      #unit-info .portrait {
        width: calc(var(--px) * 30);
        height: calc(var(--px) * 30);
        flex: none;
        object-fit: cover;
        image-rendering: auto;
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 1.5);
        box-shadow: 0 0 0 var(--px) #0a0f24;
        background: #0a0f24;
      }
      #unit-info.floating,
      body.hand-shown #unit-info.floating {
        right: auto;
        bottom: auto;
        z-index: 6;
        opacity: 0.96;
        /* Compact beside the unit: three-quarter size type, so it covers little of the board. */
        font-size: calc(var(--px) * 6);
        min-width: 0;
        padding: calc(var(--px) * 3) calc(var(--px) * 4);
      }
      #unit-info.floating .portrait {
        width: calc(var(--px) * 24);
        height: calc(var(--px) * 24);
      }
      #unit-info.floating .bar { height: calc(var(--px) * 3); }
      /* The hand: menu-style cards along the bottom; the tile and unit panels step aside while it is open
         (a unit pointed at still shows its box, beside it). */
      #ui.choosing #tile-info,
      #ui.choosing #unit-info:not(.floating) {
        display: none;
      }
      /* The hand: the animated cards on their own canvas, at full resolution and smooth like the
         battle scenes (src/cards/HandView.ts). Invisible boxes over the cards take the pointer. */
      #card-hand {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        font-family: 'Source Sans 3', system-ui, sans-serif;
      }
      #card-hand[hidden] {
        display: none;
      }
      #card-hand canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: auto;
      }
      #card-hand .card {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: auto;
        cursor: pointer;
        touch-action: none;
        border-radius: 3%;
      }
      #card-hand .card.used,
      #card-hand .card.played,
      #card-hand .card.locked {
        cursor: default;
      }
      /* In focus, the focused card is drawn lifted in the middle; its slot in the fan keeps a faint outline. */
      #card-hand .card.lifted {
        outline: 2px dashed rgba(255, 224, 138, 0.5);
        outline-offset: -6px;
        background: rgba(10, 12, 26, 0.22);
      }
      /* Tucked, only the cards' tops show: a stamp sits near the top, where it can be seen. */
      #card-hand.tucked .card .stamp {
        top: 9%;
      }
      /* The hand in focus: the board and its panels blur and dim behind it, so the cards hold the eye. */
      #stage {
        transition: filter 200ms ease-out;
      }
      body.hand-shown #tile-info,
      body.hand-shown #unit-info {
        bottom: calc(12vh + var(--px) * 6);
      }
      body.hand-focus #stage {
        filter: blur(6px) brightness(0.55) saturate(0.8);
      }
      #card-hand .card .stamp {
        position: absolute;
        left: -4%;
        right: -4%;
        top: 46%;
        padding: 0.25em 0;
        font-family: Cinzel, serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: center;
        color: #ffe08a;
        background: rgba(10, 12, 26, 0.84);
        border-top: 1px solid rgba(255, 224, 138, 0.6);
        border-bottom: 1px solid rgba(255, 224, 138, 0.6);
        transform: rotate(-8deg);
        white-space: nowrap;
      }
      #card-hand .keys {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 0.3em 1em;
        font-size: clamp(12px, 1.5vh, 16px);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #f4f1e8;
        background: rgba(12, 16, 32, 0.72);
        border: 1px solid rgba(255, 244, 214, 0.35);
        border-radius: 1em;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* The battle scene: full resolution and smooth, never pixelated. */
      /* Above every map window (the floating unit window, the hand, the turn banner: z 5 to 8),
         below the cut-in (30), the result (40) and the wipe (50). */
      #battle {
        position: fixed;
        inset: 0;
        z-index: 20;
        image-rendering: auto;
      }
      #battle-hud {
        position: fixed;
        inset: 0;
        z-index: 21;
        pointer-events: none;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        color: #f4f1e8;
        --u: min(1vw, 1.78vh);
      }
      #battle-hud .banner {
        position: absolute;
        top: calc(var(--u) * 1.6);
        width: calc(var(--u) * 34);
        padding: calc(var(--u) * 0.9) calc(var(--u) * 1.4);
        border-radius: calc(var(--u) * 0.6);
        border: calc(var(--u) * 0.18) solid rgba(255, 244, 214, 0.85);
        box-shadow: 0 calc(var(--u) * 0.3) calc(var(--u) * 1.2) rgba(0, 0, 0, 0.35);
        text-shadow: 0 calc(var(--u) * 0.12) calc(var(--u) * 0.3) rgba(0, 0, 0, 0.6);
      }
      #battle-hud .banner.left {
        left: calc(var(--u) * 1.6);
        background: linear-gradient(160deg, rgba(40, 72, 160, 0.92), rgba(18, 30, 78, 0.92));
      }
      #battle-hud .banner.right {
        right: calc(var(--u) * 1.6);
        text-align: right;
        background: linear-gradient(200deg, rgba(168, 44, 44, 0.92), rgba(78, 16, 20, 0.92));
      }
      /* The colour follows the side, not the place: the player's is blue and the foes' red, whichever
         end of the field each stands at (the foes attack from the left, B7). */
      #battle-hud .banner.ally {
        background: linear-gradient(160deg, rgba(40, 72, 160, 0.92), rgba(18, 30, 78, 0.92));
      }
      #battle-hud .banner.foe {
        background: linear-gradient(200deg, rgba(168, 44, 44, 0.92), rgba(78, 16, 20, 0.92));
      }
      #battle-hud .who {
        display: flex;
        align-items: baseline;
        gap: calc(var(--u) * 1);
      }
      #battle-hud .right .who { flex-direction: row-reverse; }
      #battle-hud .name {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: calc(var(--u) * 2.3);
        letter-spacing: 0.04em;
      }
      #battle-hud .cls {
        font-size: calc(var(--u) * 1.3);
        color: #ffe7a8;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      #battle-hud .morale {
        display: flex;
        align-items: center;
        gap: calc(var(--u) * 0.8);
        margin-top: calc(var(--u) * 0.5);
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
      }
      #battle-hud .right .morale { flex-direction: row-reverse; }
      #battle-hud .label { letter-spacing: 0.12em; color: #ffe7a8; }
      #battle-hud .bar {
        flex: 1;
        height: calc(var(--u) * 1.1);
        border-radius: calc(var(--u) * 0.6);
        background: rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: flex;
      }
      #battle-hud .right .bar { justify-content: flex-end; }
      #battle-hud .bar span {
        background: linear-gradient(#b8f59a, #4fae3c);
        border-radius: inherit;
      }
      #battle-hud .value { font-size: calc(var(--u) * 1.6); min-width: calc(var(--u) * 3.4); }
      #battle-hud .troops {
        display: flex;
        gap: calc(var(--u) * 0.45);
        margin-top: calc(var(--u) * 0.6);
      }
      #battle-hud .right .troops { justify-content: flex-end; }
      #battle-hud .troops i {
        width: calc(var(--u) * 1.1);
        height: calc(var(--u) * 1.1);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: calc(var(--u) * 0.12) solid rgba(255, 244, 214, 0.6);
      }
      #battle-hud .troops i.up { background: #ffe08a; }
      #battle-hud .morale .label { min-width: calc(var(--u) * 6.4); }
      #battle-hud .who .edge {
        margin-left: auto;
        font-weight: 700;
        font-size: calc(var(--u) * 1.3);
        letter-spacing: 0.12em;
      }
      #battle-hud .right .who .edge { margin-left: 0; margin-right: auto; }

        background: linear-gradient(90deg, rgba(78, 16, 20, 0), rgba(150, 36, 36, 0.92) 25%, rgba(150, 36, 36, 0.92) 75%, rgba(78, 16, 20, 0));
        border-color: rgba(255, 180, 160, 0.8);
      }
      #turn-banner .words {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: max(28px, calc(var(--u) * 4.6));
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffe08a;
        text-shadow: 0 0.05em 0 #4a2a08, 0 0 0.3em rgba(0, 0, 0, 0.6);
      }
      #turn-banner.enemy .words {
        color: #ffd2c4;
      }
      #turn-banner .number {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-weight: 600;
        font-size: max(16px, calc(var(--u) * 2));
        color: #f4f1e8;
      }
      @keyframes banner-sweep {
        0% { transform: translateX(-100%); opacity: 0; }
        22% { transform: translateX(0); opacity: 1; }

      }
      #battle-hud [hidden] { display: none; }
      #fallback {

      }
    </style>
