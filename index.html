<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama Tactics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2 15 6 8 10 1 6z' fill='%237a9552'/%3E%3Cpath d='M1 6 8 10v4L1 10z' fill='%236a4c31'/%3E%3Cpath d='M15 6 8 10v4l7-4z' fill='%235a4029'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        --px: 1px;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: 'Silkscreen', monospace;
        font-size: calc(var(--px) * 8);
        line-height: 1.25;
        color: #eef2ff;
        text-shadow: var(--px) var(--px) 0 #0a0f24;
      }
      #tile-info {
        position: absolute;
        left: calc(var(--px) * 8);
        bottom: calc(var(--px) * 8);
        min-width: calc(var(--px) * 92);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #tile-info .head {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--px) * 8);
      }
      #tile-info .h,
      #tile-info .stats {
        color: #ffe27a;
      }
      #hud {
        position: absolute;
        left: calc(var(--px) * 8);
        top: calc(var(--px) * 8);
        max-width: calc(var(--px) * 200);
        padding: calc(var(--px) * 4) calc(var(--px) * 6);
        background: linear-gradient(#34488a, #18224d);
        border: var(--px) solid #c9d4f0;
        border-radius: calc(var(--px) * 2);
        box-shadow: 0 0 0 var(--px) #0a0f24;
      }
      #hud .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--px) * 4);
        margin-top: calc(var(--px) * 3);
      }
      #hud button,
      #hud select {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        color: #ffe27a;
        text-shadow: inherit;
        padding: 0 calc(var(--px) * 3);
        background: #22306a;
        border: var(--px) solid #8fa0d8;
        border-radius: calc(var(--px) * 1);
      }
      #hud select option {
        background: #22306a;
      }
      #hud button:hover,
      #hud button:focus-visible,
      #hud select:hover,
      #hud select:focus-visible {
        background: #3a4f9a;
        outline: none;
      }
      #hud .notice {
        margin-top: calc(var(--px) * 3);
        color: #ffb8a8;
      }
      #fallback {
        color: #c8c2b0;
        font: 16px monospace;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="ui"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
